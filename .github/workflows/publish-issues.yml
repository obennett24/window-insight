name: Publish Issues to GitHub Pages

on:
  issues:
    types: [opened, edited, reopened, closed]

  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  issues: read

concurrency:
  group: publish-issues
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown beautifulsoup4

      - name: Generate articles from Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: obennett24/window-insight
        run: python scripts/publish_issues.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html articles/
          if ! git diff --cached --quiet; then
            git commit -m "Update articles from GitHub Issues"
            git push
          fi
